<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An interactive map of Zakhar Shumaylov's research: topics, sub-topics and the papers behind them.">
    <title>Research Map - Zakhar Shumaylov</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/site-nav.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <link rel="stylesheet" href="assets/research-map.css">

    <style>
        /* --- Basic Setup --- */
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #fdfdfd;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* --- Typography & Links --- */
        h1 {
            font-family: 'Lora', serif;
            color: #111;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-top: 2.5rem;
            font-size: 2.5rem;
        }
        a {
            color: #007bff;
            text-decoration: none;
            transition: color 0.2s;
        }
        a:hover {
            color: #0056b3;
        }
        .intro {
            font-size: 0.9rem;
            color: #555;
            max-width: 760px;
        }

        /* --- Papers in the side panel --- */
        .publication {
            margin-bottom: 1rem;
            padding-left: 12px;
            border-left: 3px solid #eee;
            font-size: 0.8rem;
        }
        .pub-title {
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 0.1rem;
        }
        .pub-authors {
            font-style: italic;
            color: #333;
            margin-bottom: 0.1rem;
            font-size: 0.75rem;
        }
        .pub-venue-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 0.1rem;
        }
        .pub-venue {
            color: #444;
            font-size: 0.75rem;
        }
        .pub-link {
            margin-left: 10px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .author-highlight {
            font-weight: 700;
            font-style: normal;
            background-color: #fffbe6;
            padding: 2px 5px;
            border-radius: 4px;
            border: 1px solid #f0e68c;
            color: #111;
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <div class="site-nav-inner">
            <a href="./index.html" class="site-nav-name">Zakhar Shumaylov</a>
            <div class="site-nav-links">
                <a href="./publications.html">Publications</a>
                <a href="./research.html" aria-current="page">Research Map</a>
                <a href="./news.html">Updates</a>
                <a href="./resume.pdf" target="_blank">CV</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Research Map</h1>
        <p class="intro">
            How my work fits together: bubbles are topics and papers, and arrows point from a topic to its sub-topics.
            Bigger bubbles cover more papers. Click any bubble to list every paper under it.
        </p>
        <div id="research-map" class="rmap rmap-wide">
            <p>Loading research map...</p>
        </div>
    </div>

    <script src="assets/research-map.js"></script>
</body>
</html>
