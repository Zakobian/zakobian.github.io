# Research map shown on the homepage (rendered by assets/research-map.js).
#
# Canvas units: x grows right, y grows down. Nodes are drawn in the order listed,
# so later nodes sit on top of earlier ones.
#
# Bubble size is automatic: it grows with the number of papers in the bubble and
# everything below it (its arrows' targets and `within` children), capped for the
# biggest topics. The font size follows the bubble size. Clicking a bubble lists
# all of those papers.
#
# Node fields:
#   id        unique name, used by edges
#   label     short text in the bubble (full paper titles show when it is clicked); "\n" forces a line break
#   x, y      centre position
#   w, h      make it a rounded box of this size instead of a circle
#   r         optional: override the automatic radius
#   color     fill colour; text colour is picked automatically
#   stroke    optional outline colour (default: a darker shade of color)
#   status    wip -> dashed pink "in progress" style
#   within    id of a node this one sits inside / belongs to (counts as its child, no arrow drawn)
#   papers    list of keys from publications.bib
#   links     extra links: [{text: Code, url: https://...}]
#   blurb     optional sentence shown above the papers
#   image     optional picture shown in the side panel when the bubble is clicked,
#             e.g. assets/research-map/lie.png (any web image: png, jpg, webp, svg)
#   thumb     optional: also show that image on the map as a tilted card behind the bubble:
#               thumb: {dx: 130, dy: -40, w: 100, h: 100, rotate: 4}
#             dx/dy = card centre relative to the bubble centre, w/h = card size, rotate = tilt in degrees.
#             The image is cropped to fill w x h, so match w/h to the image's aspect ratio.
#             Use images at least ~3x the card size (e.g. 300px wide for w: 100) so they stay sharp.
#
# Edges go from a topic to its sub-topic: [from, to] or [from, to, bend], where bend curves the arrow.
# For full control use {from, to, via: [[x1, y1], [x2, y2]], top: true}:
#   via  one or two control points for a curve; top  draw the arrow over the bubbles.

canvas: [1200, 1180]

# Font for the whole map (any Google Fonts family name).
